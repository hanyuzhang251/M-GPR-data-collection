[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "marketgpr"
version = "0.1.0"
description = "Kalshi prediction-market contract tools for geopolitical risk research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Needed for `marketgpr index` / `embed` / `search`. Requires a Python built
# with loadable-extension support (Homebrew or Linux system Python — not the
# python.org macOS framework build).
semantic = ["sqlite-vec>=0.1.0", "sentence-transformers>=3.0.0"]

[project.scripts]
marketgpr = "marketgpr.cli:main"

[tool.setuptools.packages.find]
include = ["marketgpr*"]
